---
Name: freshservice-routes
After: '#rootroutes'
---
SilverStripe\Control\Director:
  rules:
    # FreshService API routes - standalone controller
    'api/freshservice//$Action/$ID/$OtherID': 'App\Controllers\FreshServicePageController'
    'api/freshservice/$Action/$ID': 'App\Controllers\FreshServicePageController'
    'api/freshservice/$Action': 'App\Controllers\FreshServicePageController'
    'api/freshservice': 'App\Controllers\FreshServicePageController'
